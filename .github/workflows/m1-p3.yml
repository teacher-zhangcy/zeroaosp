# m1-p3.yml — M1 最窄切片闭环 v2：CI 里起一台 Android → 把我们的 native 服务推进去 → 观测到它
#
# v2 相对 v1 的修复：
#   1) **PATH 病根**：v1 只在部分步骤 export PATH，导致 adb 找不到（`adb: command not found`），
#      等待启动的循环空转 14 分钟、观测全空。v2 用 $GITHUB_PATH 一次性把 SDK 工具加进后续所有步骤。
#   2) **假性成功**：v1 的 `|| true` 把失败吞掉了（job 报 success 但没有任何证据）。
#      v2 增加"证据断言"步骤：拿不到 ps/service 证据就 exit 1，让 run 的结论如实反映。
#   3) 启动等待有界（10 分钟），并把结果写进文件供后续步骤判断。
#
# 主路 emulator-aosp   : 官方 prebuilt AOSP 镜像（SDK manager 的 aosp_atd，无 GMS）+ emulator + KVM
# 副路 cuttlefish-attempt: 按官方文档路线尝试 Cuttlefish（有界、只记原始输出，不阻塞主路）
name: m1-p3-boot-and-serve

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ───────────────────────── 主路：起 Android 并把服务跑起来 ─────────────────────────
  emulator-aosp:
    name: P3 起 Android（官方 AOSP prebuilt / emulator / KVM）
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      SDK: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: 工具路径解析（只硬性要求 sdkmanager/adb；v3 修复）
        run: |
          set -ux          # 故意不用 -e：可选工具缺失不应该中断，只应被记录
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"          >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "--- SDK 根目录 ---"; ls -l "$SDK" || true
          echo "--- 工具存在性 ---"
          for t in sdkmanager avdmanager adb emulator; do
            printf '%s -> %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          sdkmanager --version || true
          adb version 2>&1 | head -2 || true
          nproc; free -h | head -2; df -h / | tail -1
          command -v sdkmanager >/dev/null || { echo "NO_SDKMANAGER"; exit 1; }
          command -v adb >/dev/null || { echo "NO_ADB"; exit 1; }

      - name: KVM 放开权限 + ioctl 复核
        run: |
          set -eux
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          python3 -c 'import fcntl,os;fd=os.open("/dev/kvm",os.O_RDWR);print("KVM_GET_API_VERSION =",fcntl.ioctl(fd,0xAE00,0));os.close(fd)'

      - name: 安装 SDK 包（emulator + platform-tools + 官方 AOSP 系统镜像）
        id: img
        run: |
          set -eux
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "== 装 emulator / platform-tools（本 runner 镜像可能不带 emulator 包）"
          sdkmanager "platform-tools" "emulator" > /tmp/sdk_emu.log 2>&1 || tail -20 /tmp/sdk_emu.log || true
          EMU_BIN=$(command -v emulator || find "$SDK" -maxdepth 3 -type f -name emulator | head -1 || true)
          test -n "$EMU_BIN" || { echo "NO_EMULATOR_BINARY"; tail -30 /tmp/sdk_emu.log || true; exit 1; }
          echo "EMU_BIN=$EMU_BIN"
          echo "EMU_BIN=$EMU_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$EMU_BIN")" >> "$GITHUB_PATH"
          IMG=""
          for c in "system-images;android-34;aosp_atd;x86_64" \
                   "system-images;android-33;aosp_atd;x86_64" \
                   "system-images;android-31;aosp_atd;x86_64" \
                   "system-images;android-34;google_atd;x86_64"; do
            echo "== try $c"
            if sdkmanager "$c" > /tmp/sdk_install.log 2>&1; then echo "INSTALLED_OK $c"; IMG="$c"; break; fi
            echo "INSTALL_FAILED $c"; tail -6 /tmp/sdk_install.log || true
          done
          test -n "$IMG" || { echo "NO_IMAGE_INSTALLED"; exit 1; }
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          df -h / | tail -1

      - name: 建 AVD 并启动模拟器（headless / swiftshader / KVM）
        run: |
          set -eux
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "EMU_BIN=$EMU_BIN"; test -x "$EMU_BIN"
          (echo no | avdmanager create avd --force -n m1 -k "${{ steps.img.outputs.img }}" --device pixel_5) \
            || (echo no | avdmanager create avd --force -n m1 -k "${{ steps.img.outputs.img }}")
          nohup "$EMU_BIN" -avd m1 -no-window -no-audio -no-boot-anim -no-snapshot \
                 -gpu swiftshader_indirect -memory 3072 -cores 2 -verbose > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          sleep 30
          echo "emulator pid=$(cat /tmp/emulator.pid)"
          kill -0 "$(cat /tmp/emulator.pid)" 2>/dev/null && echo "emulator alive=yes" || echo "emulator alive=no"
          grep -m3 -E 'CPU Acceleration|KVM' /tmp/emulator.log || true
          tail -5 /tmp/emulator.log || true

      - name: 等 Android 启动完成（有界 10 分钟）
        run: |
          set -x
          command -v adb || { echo "ADB_NOT_ON_PATH"; exit 1; }
          adb start-server || true
          timeout 120 adb wait-for-device || true
          BOOT=no
          for i in $(seq 1 60); do
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[$i] sys.boot_completed='$b'"
            if [ "$b" = "1" ]; then BOOT=yes; break; fi
            sleep 10
          done
          echo "BOOT_OK=$BOOT" | tee /tmp/boot_ok.txt
          adb devices -l || true

      - name: 观测（adb devices / fingerprint / ps / service list）
        run: |
          set -x
          adb devices -l || true
          echo "fingerprint = $(adb shell getprop ro.build.fingerprint 2>/dev/null || true)"
          echo "build.type  = $(adb shell getprop ro.build.type 2>/dev/null || true)"
          echo "abi         = $(adb shell getprop ro.product.cpu.abi 2>/dev/null || true)"
          echo "release     = $(adb shell getprop ro.build.version.release 2>/dev/null || true)"
          echo "ps_count    = $(adb shell 'ps -A | wc -l' 2>/dev/null || true)"
          echo "svc_count   = $(adb shell 'service list | wc -l' 2>/dev/null || true)"
          df -h / | tail -1

      - name: 用 NDK 编我们的服务（stub 保底 + libbinder_ndk 尽力；并报告 NDK 的 binder 头与符号）
        run: |
          set -eux
          NDK="$SDK/ndk/$(ls "$SDK/ndk" | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "NDK=$NDK"
          echo "=== (a) NDK 里有哪些 android/binder*.h ==="
          ls "$SYSROOT/usr/include/android/" 2>/dev/null | grep -i binder || echo "NO_ANDROID_BINDER_HEADERS"
          echo "=== (b) libbinder_ndk.so 是否导出 AServiceManager_addService ==="
          for f in $(find "$NDK" -name 'libbinder_ndk.so' 2>/dev/null | head -2); do
            echo "-- $f"
            nm -D "$f" 2>/dev/null | grep -E 'AServiceManager_addService|AIBinder_new|AIBinder_Class_define' || echo "   (nm 无匹配)"
          done
          echo "=== (c) 保底版：不依赖 binder 头；静态链接 libc++ 以便在设备上直接跑 ==="
          "$TC/x86_64-linux-android30-clang++" -O2 -std=c++17 -static-libstdc++ \
              m1/service/dsh_hello_service.cpp -o dsh_hello_service.stub
          file dsh_hello_service.stub; sha256sum dsh_hello_service.stub | tee dsh.stub.sha256
          "$TC/llvm-readelf" -d dsh_hello_service.stub 2>/dev/null | grep -i 'NEEDED' || true
          echo "=== (d) 尽力版：libbinder_ndk（自声明 + 允许运行期解析 AServiceManager_addService） ==="
          if "$TC/x86_64-linux-android30-clang++" -O2 -std=c++17 -static-libstdc++ -DDSH_WITH_BINDER_NDK=1 \
               m1/service/dsh_hello_service.cpp -lbinder_ndk \
               -Wl,--unresolved-symbols=ignore-all -o dsh_hello_service.binder; then
            echo "BINDER_BUILD_OK"; file dsh_hello_service.binder; sha256sum dsh_hello_service.binder | tee dsh.binder.sha256
            "$TC/llvm-readelf" -d dsh_hello_service.binder 2>/dev/null | grep -i 'NEEDED' || true
          else
            echo "BINDER_BUILD_FAILED（编译错误见上方）"
          fi

      - name: 路径1 —— 设备端 libbinder 直连（拉设备 .so 当链接桩 + 取 AOSP 14 头文件编译）
        run: |
          set -ux
          NDK="$SDK/ndk/$(ls "$SDK/ndk" | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "=== (a) 从运行中的设备拉链接桩 .so ==="
          mkdir -p devlibs
          for so in libbinder.so libutils.so libcutils.so libbase.so liblog.so libc++.so; do
            if adb pull "/system/lib64/$so" "devlibs/$so" >/dev/null 2>&1; then echo "PULL_OK $so ($(stat -c%s devlibs/$so) B)"; else echo "PULL_FAILED $so"; fi
          done
          echo "=== (b) 取 AOSP 14 的头（公开 Git，只临时 clone，不落仓） ==="
          clone_aosp() {
            git clone --depth=1 -b android-14.0.0_r1 "https://android.googlesource.com/platform/$1" "$2" 2>&1 | tail -1 || \
            git clone --depth=1 -b android-14.0.0_r1 "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/$1" "$2" 2>&1 | tail -1 || true
          }
          clone_aosp frameworks/native /tmp/fwnative
          clone_aosp system/libbase   /tmp/fwbase
          clone_aosp system/core      /tmp/fwcore
          clone_aosp system/logging   /tmp/fwlog
          INC=""
          for d in /tmp/fwnative/libs/binder/include \
                   /tmp/fwnative/libs/nativebase/include \
                   /tmp/fwbase/include \
                   /tmp/fwcore/libutils/include \
                   /tmp/fwcore/libsystem/include \
                   /tmp/fwcore/libcutils/include \
                   /tmp/fwlog/liblog/include ; do
            if [ -d "$d" ]; then INC="$INC -I$d"; echo "INC_OK $d"; else echo "INC_MISSING $d"; fi
          done
          echo "INC=$INC"
          echo "=== (c) 编译（--no-undefined：链接期就把未解析符号暴露出来） ==="
          OK=no
          for std in c++20 c++17; do
            echo "-- try -std=$std"
            if "$TC/x86_64-linux-android30-clang++" -O2 -std=$std -Wall -fno-rtti -fno-exceptions \
                 -DDSH_WITH_BINDER=1 -DDSH_DEVICE_LINKED=1 $INC \
                 m1/service/dsh_hello_service.cpp \
                 -Ldevlibs -lbinder -lutils -lcutils -lbase -llog -lc++ \
                 -Wl,-rpath-link,devlibs -Wl,--allow-shlib-undefined \
                 -o dsh_hello_service.devbinder 2>&1 | tail -25; then
              if [ -f dsh_hello_service.devbinder ]; then echo "DEVBINDER_BUILD_OK std=$std"; OK=yes; break; fi
            fi
          done
          echo "DEVBINDER_OK=$OK"
          if [ "$OK" = yes ]; then
            file dsh_hello_service.devbinder; sha256sum dsh_hello_service.devbinder | tee dsh.devbinder.sha256
            echo "=== DT_NEEDED（应含 libbinder.so / libutils.so / libc++.so） ==="
            "$TC/llvm-readelf" -d dsh_hello_service.devbinder | grep -i NEEDED || true
            echo "=== 未解析符号（--no-undefined 通过后此处应为空） ==="
            "$TC/llvm-nm" -u dsh_hello_service.devbinder 2>/dev/null | head -10 || true
          fi

      - name: 路径2 —— NDK C-API + 设备端预编译 libbinder_ndk.so（自声明 AServiceManager_addService）
        run: |
          set -ux
          NDK="$SDK/ndk/$(ls "$SDK/ndk" | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p devlibs
          echo "=== (a) 拉设备上的 libbinder_ndk.so 作为链接桩（这就是"预编译 libbinder 产物"，来源=设备镜像本身） ==="
          adb pull /system/lib64/libbinder_ndk.so devlibs/libbinder_ndk.so && echo "PULL_OK libbinder_ndk.so ($(stat -c%s devlibs/libbinder_ndk.so) B)" || echo "PULL_FAILED libbinder_ndk.so"
          echo "=== (b) 设备那支是否导出 AServiceManager_addService（NDK 自带的那支不导出，见 T-006 §3.3） ==="
          for f in devlibs/libbinder_ndk.so; do
            [ -f "$f" ] && { echo "-- $f"; "$TC/llvm-nm" -D "$f" 2>/dev/null | grep -E 'AServiceManager_addService|AIBinder_new|AIBinder_Class_define' || echo "   (无匹配)"; }
          done
          echo "=== (c) 编译（C API，无 vtable / 无 RTTI 问题） ==="
          if "$TC/x86_64-linux-android30-clang++" -O2 -std=c++17 -static-libstdc++ -DDSH_WITH_BINDER_NDK=1 \
               m1/service/dsh_hello_service.cpp -Ldevlibs -lbinder_ndk \
               -Wl,-rpath-link,devlibs -Wl,--allow-shlib-undefined \
               -o dsh_hello_service.ndkbinder 2>&1 | tail -20; then
            if [ -f dsh_hello_service.ndkbinder ]; then
              echo "NDKBINDER_BUILD_OK"; file dsh_hello_service.ndkbinder; sha256sum dsh_hello_service.ndkbinder | tee dsh.ndkbinder.sha256
              "$TC/llvm-readelf" -d dsh_hello_service.ndkbinder | grep -i NEEDED || true
              "$TC/llvm-nm" -u dsh_hello_service.ndkbinder 2>/dev/null | head -10 || true
            else
              echo "NDKBINDER_BUILD_FAILED(no output)"
            fi
          else
            echo "NDKBINDER_BUILD_FAILED(compile)"
          fi

      - name: 路径1/2 验证 —— 分别推 devbinder 与 ndkbinder，逐支看 service check / service list / dumpsys
        run: |
          set -x
          test "$(cat /tmp/boot_ok.txt)" = "BOOT_OK=yes" || echo "WARN: 未确认启动完成，仍继续观测"
          adb root || true; sleep 5; adb wait-for-device || true
          adb shell setenforce 0 || true
          for tag in devbinder ndkbinder; do
            bin="dsh_hello_service.$tag"
            echo "############ $tag ############"
            if [ ! -f "$bin" ]; then echo "SKIP_${tag}：二进制未编出（编译阶段已给原始错误）"; continue; fi
            ls -l "$bin"
            adb push "$bin" "/data/local/tmp/dsh_$tag" || true
            adb shell chmod 755 "/data/local/tmp/dsh_$tag" || true
            adb shell "setsid /data/local/tmp/dsh_$tag > /data/local/tmp/dsh_$tag.log 2>&1 < /dev/null &" || true
            sleep 7
            echo "=== [$tag] 自身日志 ==="; adb shell cat "/data/local/tmp/dsh_$tag.log" || true
            echo "=== [$tag] ps ==="; adb shell 'ps -A | grep -i dsh' || true
            echo "=== [$tag] service check dsh_hello_service ==="; adb shell 'service check dsh_hello_service' || true
            echo "=== [$tag] service list | grep -i dsh ==="; adb shell 'service list | grep -i dsh' || true
            echo "=== [$tag] dumpsys dsh_hello_service ==="; adb shell 'dumpsys dsh_hello_service' || true
            adb shell "pkill -f dsh_$tag" || true
            sleep 2
          done

      - name: P4 保底 —— 推 stub 版并观测进程（006 已达成的部分，作对照）
        run: |
          set -x
          test "$(cat /tmp/boot_ok.txt)" = "BOOT_OK=yes" || echo "WARN: 上一阶段未确认启动完成，仍继续观测"
          adb root || true; sleep 5; adb wait-for-device || true
          adb shell setenforce 0 || true
          BIN=dsh_hello_service.stub
          if [ -f dsh_hello_service.binder ]; then BIN=dsh_hello_service.binder; echo "推送：binder 版"; else echo "推送：stub 版（binder 版未编出）"; fi
          ls -l "$BIN"
          adb push "$BIN" /data/local/tmp/dsh_hello_service || true
          adb shell chmod 755 /data/local/tmp/dsh_hello_service || true
          adb shell "setsid /data/local/tmp/dsh_hello_service > /data/local/tmp/dsh.log 2>&1 < /dev/null &" || true
          sleep 8
          echo "=== /data/local/tmp/dsh.log ==="; adb shell cat /data/local/tmp/dsh.log || true
          echo "=== ps -A（我们那一行） ==="; adb shell 'ps -A | grep -i dsh' || true
          echo "=== ps -A -o PID,USER,NAME（前 5 行） ==="; adb shell 'ps -A -o PID,USER,NAME 2>/dev/null | head -5' || true
          echo "=== service check dsh_hello_service ==="; adb shell 'service check dsh_hello_service' || true
          echo "=== service list | grep -i dsh ==="; adb shell 'service list | grep -i dsh' || true
          echo "=== dumpsys dsh_hello_service（前 20 行） ==="; adb shell 'dumpsys dsh_hello_service 2>&1 | head -20' || true

      - name: 收集日志（always）
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/emulator.log logs/ 2>/dev/null || true
          cp /tmp/sdk_install.log logs/ 2>/dev/null || true
          cp /tmp/boot_ok.txt logs/ 2>/dev/null || true
          adb devices -l > logs/adb_devices.txt 2>&1 || true
          adb shell getprop > logs/getprop.txt 2>&1 || true
          adb shell 'ps -A' > logs/ps-A.txt 2>&1 || true
          adb shell 'service list' > logs/service_list.txt 2>&1 || true
          adb shell 'service check dsh_hello_service' > logs/service_check.txt 2>&1 || true
          adb shell 'dumpsys dsh_hello_service' > logs/dumpsys.txt 2>&1 || true
          adb shell cat /data/local/tmp/dsh.log > logs/dsh.log 2>&1 || true
          adb shell cat /data/local/tmp/dsh_dev.log > logs/dsh_dev.log 2>&1 || true
          { df -h /; free -h; nproc; } > logs/resources.txt 2>&1 || true
          ls -l logs || true

      - name: 证据断言（T-007 口径：service check 正命中 或 dumpsys 有输出才算成功）
        if: always()
        run: |
          set -x
          echo "--- service check ---"; cat logs/service_check.txt || true
          echo "--- service list（grep dsh） ---"; grep -i dsh logs/service_list.txt || true
          echo "--- dumpsys ---"; cat logs/dumpsys.txt || true
          echo "--- dsh_dev.log（路径1 那支的自身日志） ---"; cat logs/dsh_dev.log 2>/dev/null || true
          echo "--- ps（006 已达成的部分，本单不计入成功） ---"; grep -i dsh logs/ps-A.txt || true
          SVC_OK=no; DUMP_OK=no
          if grep -q 'Service dsh_hello_service: found' logs/service_check.txt; then SVC_OK=yes; fi
          if grep -qi dsh logs/dumpsys.txt && ! grep -qi "Can't find service" logs/dumpsys.txt; then DUMP_OK=yes; fi
          echo "SVC_OK=$SVC_OK DUMP_OK=$DUMP_OK"
          if [ "$SVC_OK" = yes ] || [ "$DUMP_OK" = yes ]; then
            echo "T007_SUCCESS (svc=$SVC_OK dump=$DUMP_OK)"
            exit 0
          fi
          echo "T007_NOT_REGISTERED (svc=$SVC_OK dump=$DUMP_OK)"; exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-p3-logs
          path: logs/
          if-no-files-found: warn

  # ───────────────────── 副路：Cuttlefish 官方文档路线尝试（有界，只记原始输出） ─────────────────────
  cuttlefish-attempt:
    name: P3b Cuttlefish 尝试（有界；原始输出）
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: 公共构建入口探测（逐条原始状态码）
        run: |
          set -x
          for u in \
            "https://ci.android.com/" \
            "https://ci.android.com/builds/branches/aosp-main/grid" \
            "https://ci.android.com/builds/latest/branches/aosp-main/targets/aosp_cf_x86_64_phone-userdebug/view" \
            "https://ci.android.com/builds/submitted/" \
            "https://android-build.googleplex.com/builds/branches/aosp-main/grid" \
            "https://us-apt.cuttlefish.google.com/" \
            "https://storage.googleapis.com/" ; do
            code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' -L "$u" 2>/dev/null || echo ERR)
            echo "PROBE http=$code url=$u"
          done

      - name: 是否已有 cvd / launch_cvd（apt 路线的前置）
        run: |
          set -x
          (which cvd && cvd --help 2>&1 | head -15) || echo "NO_CVD_BINARY"
          (which launch_cvd && launch_cvd --help 2>&1 | head -15) || echo "NO_LAUNCH_CVD_BINARY"
          (apt-cache search cuttlefish 2>&1 | head -10) || true

      - name: 官方 apt 源可达性（按文档路线；失败即记录原始错误）
        continue-on-error: true
        run: |
          set -x
          curl -v -m 30 -o /tmp/cf.gpg https://us-apt.cuttlefish.google.com/artifactory/apt-cuttlefish-public/cuttlefish-public.gpg 2>&1 | tail -20 || true
          ls -l /tmp/cf.gpg 2>/dev/null || echo "NO_GPG_FILE"

      - name: 结论
        run: echo "见上方原始输出；本 job 失败不影响主路"
